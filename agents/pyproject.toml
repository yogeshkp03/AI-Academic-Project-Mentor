[project]
name = "agents"
version = "0.1.0"
description = "CrewAI feasibility-analysis service exposed as a FastAPI API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai[google-genai,litellm]>=1.15.21,<2",
    "ddgs>=9,<12",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "python-dotenv>=1.2,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-timeout>=2,<3",
]

[tool.pytest.ini_options]
addopts = "--timeout=60 -q"
testpaths = ["tests"]
